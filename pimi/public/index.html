<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Pimi</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/syntax.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <nav aria-label="Main">
        <button id="show-board" aria-current="page">Worktrees</button>
        <button id="show-review" disabled>Review</button>
      </nav>
      <div class="toolbar-actions">
        <a
          id="show-agents"
          class="button secondary"
          href="pimi-agents://open"
          target="_blank"
          hidden
        >
          Agent Console
        </a>
      </div>
    </header>
    <main>
      <section id="board" class="board-view">
        <div class="section-header">
          <h1>Worktrees</h1>
        </div>
        <div class="board-tools">
          <input
            id="board-search"
            class="search"
            type="search"
            aria-label="Search worktrees and agents"
            placeholder="Find a worktree or agent"
            autocomplete="off"
            aria-keyshortcuts="/"
          />
          <kbd title="Focus search">/</kbd>
          <div class="board-actions">
            <button id="refresh-board" class="button secondary">Refresh</button>
            <details class="watch">
              <summary class="button secondary">Add repository…</summary>
              <div class="watch-panel">
                <form id="watch-repo" class="compare">
                  <label>
                    Repository path
                    <input
                      id="repo-path"
                      placeholder="/path/to/repository"
                      autocomplete="off"
                      required
                    />
                  </label>
                  <button id="add-repo" class="button primary" type="submit">Add</button>
                </form>
                <p id="watch-error" class="warning" role="alert" hidden></p>
              </div>
            </details>
          </div>
        </div>
        <p id="board-warning" class="warning" hidden></p>
        <div id="lanes" class="lanes" aria-label="Worktree board"></div>
        <section id="other-agents" class="other-agents" hidden aria-labelledby="agents-heading">
          <h2 id="agents-heading">Other active sessions</h2>
          <p class="subtitle">Sessions outside your watched repositories.</p>
          <div id="agent-list"></div>
        </section>
      </section>

      <section id="review" class="review-view" hidden aria-label="Code review">
        <div class="section-header review-heading">
          <div>
            <p id="review-repo" class="context-label">Worktree review</p>
            <h1 id="review-title">Review</h1>
            <p id="review-meta" class="subtitle" role="status"></p>
          </div>
          <div class="review-actions">
            <div id="previews" class="previews" hidden></div>
            <button id="open-worktree" class="button secondary" disabled>Open in Zed ↗</button>
          </div>
        </div>
        <form id="compare" class="compare">
          <label
            >Comparison
            <select id="mode">
              <option value="all">Branch + working changes</option>
              <option value="committed">Committed changes</option>
              <option value="working">Working changes only</option>
              <option value="pr">GitHub pull request</option>
            </select>
          </label>
          <label id="base-control"
            >Base ref <input id="base" placeholder="Auto-detect base" autocomplete="off"
          /></label>
          <label id="pr-control" hidden
            >Pull request URL
            <input id="pr" placeholder="https://github.com/owner/repo/pull/123" autocomplete="off"
          /></label>
          <button id="load-review" class="button secondary" type="submit">Load changes</button>
        </form>
        <p id="review-warning" class="warning" role="alert" hidden></p>
        <div class="desk">
          <aside class="files">
            <div class="files-heading">
              <h2>Changed files</h2>
              <span id="file-count" class="count">0</span>
            </div>
            <div class="file-tools">
              <input
                id="file-search"
                class="search"
                type="search"
                aria-label="Filter changed files"
                placeholder="Filter files"
                autocomplete="off"
                aria-keyshortcuts="/"
              />
            </div>
            <div id="file-list" class="file-list"></div>
          </aside>
          <div class="workspace">
            <div class="tourbar">
              <div>
                <span class="context-label">Walkthrough</span>
                <span id="tour-status" class="tour-status" role="status"
                  >Load changes to start</span
                >
              </div>
              <div class="tour-actions">
                <button id="file-tour" class="button secondary" disabled>File tour</button>
                <button id="ai-tour" class="button primary" disabled>Explain changes</button>
              </div>
            </div>
            <div id="panes" class="panes"></div>
            <div
              id="tour-card"
              class="tour-card"
              role="region"
              aria-label="Walkthrough note"
              hidden
            >
              <div class="note-top">
                <span id="tour-position" class="context-label"></span>
                <button id="close-tour" class="icon-button" aria-label="Close walkthrough note">
                  ×
                </button>
              </div>
              <h2 id="note-title"></h2>
              <p id="note-text"></p>
              <div class="note-actions">
                <button id="prev-step" class="button secondary" aria-keyshortcuts="[">
                  ← Previous
                </button>
                <button id="next-step" class="button primary" aria-keyshortcuts="]">Next →</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
