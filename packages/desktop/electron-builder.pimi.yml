extends: ./electron-builder.yml
appId: com.pimi.desktop
productName: Pimi
executableName: Pimi
extraMetadata:
  productName: Pimi
directories:
  output: release-pimi
publish: null
protocols:
  - name: Pimi agent link
    schemes:
      - paseo
mac:
  icon: assets/pimi-icon.icns
  extraResources:
    - from: assets/pimi-icon.png
      to: pimi-icon.png
  extendInfo:
    NSMicrophoneUsageDescription: Pimi uses the microphone when you dictate a task brief or agent message.
  artifactName: "Pimi-${version}-${arch}.${ext}"
  notarize: false
  identity: null
