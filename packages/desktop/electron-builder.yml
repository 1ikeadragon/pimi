npmRebuild: false
appId: com.pimi.desktop
productName: Pimi
executableName: Pimi
extraMetadata:
  productName: Pimi
protocols:
  - name: Pimi agent link
    schemes:
      - pimi
afterPack: ./scripts/after-pack.js
afterSign: ./scripts/after-sign.js
directories:
  output: release
files:
  - dist/**/*
  - "!node_modules/@anthropic-ai/claude-agent-sdk-*/**"
  - "!**/*.map"
  - "!node_modules/@pimi/*/src/**"
  - "!node_modules/@pimi/**/*.test.*"
  - "!node_modules/@pimi/**/*.spec.*"
  - "!node_modules/@pimi/server/dist/server/web-ui/**"
  - "!node_modules/@pimi/server/dist/server/builtin-plugins/**"
  # Workspace packages are symlinked, so anything a dev generates inside them
  # lands in the asar. CI never has these; a local .debug run adds gigabytes.
  - "!node_modules/@pimi/*/.debug/**"
  - "!node_modules/@pimi/*/.tasks/**"
  - "!node_modules/@pimi/*/conversations/**"
  - "!node_modules/@pimi/*/test-results/**"
asarUnpack:
  - dist/daemon/node-entrypoint-runner.js
  - node_modules/@pimi/server/dist/server/terminal/shell-integration/**/*
extraResources:
  # Preserve physical compiler inputs, including .d.ts files omitted from packaged node_modules.
  - from: ../server/dist/server/builtin-plugins
    to: builtin-plugins
  - from: ../app/dist
    to: app-dist
  - from: assets/editor-targets
    to: editor-target-icons
  - from: assets/pimi-icon.png
    to: pimi-icon.png
  - from: ../../LICENSE
    to: LICENSE
  - from: ../plugin/dist
    to: plugin-sdk/plugin
    filter:
      - "**/*.d.ts"
  - from: ../client/dist
    to: plugin-sdk/client
    filter:
      - "**/*.d.ts"
  - from: ../protocol/dist
    to: plugin-sdk/protocol
    filter:
      - "**/*.d.ts"
publish: null
mac:
  artifactName: "Pimi-${version}-${arch}.${ext}"
  minimumSystemVersion: "13.0.0"
  category: public.app-category.developer-tools
  icon: assets/pimi-icon.icns
  extendInfo:
    NSMicrophoneUsageDescription: Pimi uses the microphone for voice commands, dictation, and chat Voice Mode.
  # Ad hoc signatures have no team ID for hardened runtime library validation.
  hardenedRuntime: false
  notarize: false
  identity: "-"
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extraResources:
    - from: bin/pimi
      to: bin/pimi
    # Existing desktop installs can still have an old shell link into the bundle.
    - from: bin/paseo
      to: bin/paseo
  target:
    - dmg
    - zip
linux:
  category: Development
  icon: assets/pimi-icon.png
  artifactName: "Pimi-${version}-${arch}.${ext}"
  vendor: "Pimi"
  extraResources:
    - from: bin/pimi
      to: bin/pimi
    # Existing desktop installs can still have an old shell link into the bundle.
    - from: bin/paseo
      to: bin/paseo
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
deb:
  afterInstall: scripts/linux-sandbox/after-install.tpl
rpm:
  afterInstall: scripts/linux-sandbox/after-install.tpl
appImage:
  # A nonempty argument list replaces builder's hardcoded --no-sandbox default.
  executableArgs: ["--class=Pimi"]
  # Keep this filename stable so manual replacement preserves shortcuts and shell links.
  artifactName: "Pimi-${arch}.${ext}"
win:
  artifactName: "Pimi-Setup-${version}-${arch}.${ext}"
  icon: assets/pimi-icon.png
  extraResources:
    - from: bin/pimi.cmd
      to: bin/pimi.cmd
    - from: bin/paseo.cmd
      to: bin/paseo.cmd
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
