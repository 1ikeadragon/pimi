npmRebuild: false
appId: com.pimi.desktop
productName: Pimi
executableName: Pimi
extraMetadata:
  productName: Pimi
protocols:
  - name: Pimi agent link
    schemes:
      - pimi
afterPack: ./scripts/after-pack.js
afterSign: ./scripts/after-sign.js
# Keep the Electron locales for the app's UI languages (packages/app/src/i18n/locales.ts).
# Matching ignores case and treats "_" like "-", so "en" also keeps en_GB and the
# *_FEMININE/*_MASCULINE/*_NEUTER variants, and "pt-BR" keeps pt_BR but not pt_PT.
electronLanguages:
  - en
  - ar
  - es
  - fr
  - ja
  - ko
  - pt-BR
  - ru
  - zh-CN
directories:
  output: release
files:
  - dist/**/*
  - "!node_modules/@anthropic-ai/claude-agent-sdk-*/**"
  - "!**/*.map"
  - "!node_modules/@pimi/*/src/**"
  - "!node_modules/@pimi/**/*.test.*"
  - "!node_modules/@pimi/**/*.spec.*"
  - "!node_modules/@pimi/server/dist/server/builtin-plugins/**"
  # Workspace packages are symlinked, so anything a dev generates inside them
  # lands in the asar. CI never has these; a local .debug run adds gigabytes.
  - "!node_modules/@pimi/*/.debug/**"
  - "!node_modules/@pimi/*/.tasks/**"
  - "!node_modules/@pimi/*/conversations/**"
  - "!node_modules/@pimi/*/test-results/**"
  # Nothing the daemon imports reaches these. @opencode/client's "." and "./service"
  # entries (the only ones Pimi imports) never load its effect/protocol/schema chunks,
  # and @anthropic-ai/sdk and ai are not imported by any shipped file.
  - "!node_modules/effect/**"
  - "!node_modules/fast-check/**"
  - "!node_modules/pure-rand/**"
  - "!node_modules/@opencode/protocol/**"
  - "!node_modules/@opencode/schema/**"
  - "!node_modules/@anthropic-ai/sdk/**"
  - "!node_modules/ai/**"
  - "!node_modules/@ai-sdk/**"
  # The plugin compiler loads typescript/lib/typescript.js and editor navigation spawns tsserver.js
  # (with _tsserver.js and, on Windows, watchGuard.js), so those stay.
  - "!node_modules/typescript/bin/**"
  - "!node_modules/typescript/lib/{_tsc,tsc,_typingsInstaller,typingsInstaller}.js"
  - "!node_modules/typescript/lib/{cs,de,es,fr,it,ja,ko,pl,pt-br,ru,tr,zh-cn,zh-tw}/**"
  # Third-party TypeScript sources. The extglob keeps .d.ts, .d.mts and .d.cts.
  - "!node_modules/**/!(*.d).{ts,mts,cts}"
  # Daemon source-tree leftovers. The packaged daemon runs dist/scripts/supervisor-entrypoint.js.
  - "!node_modules/@pimi/server/scripts/**"
  - "!node_modules/@pimi/server/CLAUDE.md"
  - "!node_modules/@pimi/server/tsconfig*.json"
  # Compiled test helpers that only other test helpers import.
  - "!node_modules/@pimi/*/dist/**/test-utils/**"
  - "!node_modules/@pimi/*/dist/**/test-fixtures/**"
  - "!node_modules/@pimi/*/dist/**/*.fixture.js"
  - "!node_modules/@pimi/server/dist/server/server/agent/providers/pi/extensions/*-fixture-test.js"
  - "!node_modules/@pimi/server/dist/server/server/agent/providers/claude/test-rewind-claude-sdk.js"
  - "!node_modules/@pimi/server/dist/server/server/agent/providers/opencode/test-server-manager.js"
  - "!node_modules/@pimi/server/dist/server/server/agent/rewind/test-rewind-session.js"
asarUnpack:
  - dist/daemon/node-entrypoint-runner.js
  - node_modules/@pimi/server/dist/server/terminal/shell-integration/**/*
extraResources:
  # Preserve physical compiler inputs, including .d.ts files omitted from packaged node_modules.
  - from: ../server/dist/server/builtin-plugins
    to: builtin-plugins
  - from: ../app/dist
    to: app-dist
  - from: assets/editor-targets
    to: editor-target-icons
  - from: assets/pimi-icon.png
    to: pimi-icon.png
  - from: ../../LICENSE
    to: LICENSE
  - from: ../plugin/dist
    to: plugin-sdk/plugin
    filter:
      - "**/*.d.ts"
  - from: ../client/dist
    to: plugin-sdk/client
    filter:
      - "**/*.d.ts"
  - from: ../protocol/dist
    to: plugin-sdk/protocol
    filter:
      - "**/*.d.ts"
publish: null
mac:
  artifactName: "Pimi-${version}-${arch}.${ext}"
  minimumSystemVersion: "13.0.0"
  category: public.app-category.developer-tools
  icon: assets/pimi-icon.icns
  extendInfo:
    NSMicrophoneUsageDescription: Pimi uses the microphone for voice commands, dictation, and chat Voice Mode.
  # Ad hoc signatures have no team ID for hardened runtime library validation.
  hardenedRuntime: false
  notarize: false
  identity: "-"
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extraResources:
    - from: bin/pimi
      to: bin/pimi
    # Existing desktop installs can still have an old shell link into the bundle.
    - from: bin/paseo
      to: bin/paseo
  target:
    - dmg
    - zip
win:
  artifactName: "Pimi-Setup-${version}-${arch}.${ext}"
  icon: assets/pimi-icon.png
  extraResources:
    - from: bin/pimi.cmd
      to: bin/pimi.cmd
    - from: bin/paseo.cmd
      to: bin/paseo.cmd
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
