name: Pimi desktop release

on:
  push:
    tags:
      - "pimi-v[0-9]+.[0-9]+.[0-9]+"
      - "pimi-all-v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

concurrency:
  group: pimi-desktop-release
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.repository == '1ikeadragon/pimi' &&
      github.event.created && !github.event.deleted && !github.event.forced
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      build_windows: ${{ steps.release.outputs.build_windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - name: Validate tag and prepare changelog
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES_REPO: 1ikeadragon/pimi-releases
        run: |
          tag="$GITHUB_REF_NAME"
          release_tag='^pimi-(all-)?v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          [[ "$tag" =~ $release_tag ]]
          version="${tag##*v}"
          build_windows=false
          if [[ "$tag" == pimi-all-v* ]]; then build_windows=true; fi
          commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
          test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$commit"
          git merge-base --is-ancestor "$commit" origin/main
          test "$(node -p "require('./package.json').version")" = "$version"
          test "$(node -p "require('./packages/desktop/package.json').version")" = "$version"

          node --input-type=module - "$version" > release-notes.md <<'NODE'
          import { readFileSync } from "node:fs";
          import { parseChangelogEntries } from "./scripts/changelog-utils.mjs";

          const entries = parseChangelogEntries(readFileSync("CHANGELOG.md", "utf8"));
          const entry = entries.find(({ version }) => version === process.argv[2]);
          if (entry) process.stdout.write(entry.bodyLines.join("\n") + "\n");
          NODE
          # Failed or unpublished tags must not cut off part of the changelog.
          # Releases are published to the public pimi-releases repo, so that is the source of truth.
          previous="$(gh release list --repo "$RELEASES_REPO" --limit 1 \
            --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName // empty')"
          if [[ -n "$previous" ]]; then
            [[ "$previous" =~ $release_tag ]]
            previous_version="${previous##*v}"
            test "$version" != "$previous_version"
            test "$(printf '%s\n' "$previous_version" "$version" | sort -V | tail -n 1)" = "$version"
            previous_commit="$(git rev-parse "refs/tags/$previous^{commit}")"
            if ! git merge-base --is-ancestor "$previous_commit" "$commit"; then
              # Use the matching source tree on main as the 0.17.8 changelog baseline.
              test "$previous" = pimi-v0.17.8
              release_base="8010f9e34d9f6b0e86435bff90bf412d5909d0b4"
              git merge-base --is-ancestor "$release_base" "$commit"
              test "$(git rev-parse "$previous_commit^{tree}")" = "$(git rev-parse "$release_base^{tree}")"
              previous_commit="$release_base"
            fi
            printf '\n### Changes since %s\n\n```text\n' "$previous" >> release-notes.md
            git log --first-parent --format='%h %s' "$previous_commit..$commit" >> release-notes.md
            printf '```\n' >> release-notes.md
          fi
          test -s release-notes.md
          printf 'tag=%s\nversion=%s\ncommit=%s\nbuild_windows=%s\nprevious_commit=%s\n' \
            "$tag" "$version" "$commit" "$build_windows" "${previous_commit:-}" >> "$GITHUB_OUTPUT"
      - name: Require registry tarballs with sha512 integrity in the lockfile
        run: node scripts/check-lockfile.mjs
      - name: Require npm packages to be at least 10 days old
        env:
          PREVIOUS_COMMIT: ${{ steps.release.outputs.previous_commit }}
        run: node scripts/check-release-age.mjs ${PREVIOUS_COMMIT:+"$PREVIOUS_COMMIT"}
      - name: Check npm packages against Aikido's malware feed
        run: node scripts/check-malware-feed.mjs
      - run: npm ci --no-audit --no-fund
      - name: Verify npm registry signatures and provenance attestations
        # With .npmrc's min-release-age, npm hides younger versions from the packuments this
        # reads and fails with ETARGET. check-release-age.mjs enforces the age limit instead.
        run: npm audit signatures --min-release-age=0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pimi-release-notes
          path: release-notes.md
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  mac:
    name: Build macOS installer
    needs: validate
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          architecture: arm64
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run setup
        env:
          PIMI_SKIP_NATIVE_MARKDOWN_ASSETS: "1"
      - name: Build macOS app inputs
        if: vars.APPLE_TEAM_ID != ''
        env:
          EXPO_NO_TELEMETRY: "1"
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run pimi:prepare:desktop
      - name: Sign and notarize macOS installer
        if: vars.APPLE_TEAM_ID != ''
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD NOTARY_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing macOS release signing input: $name"
              exit 1
            fi
          done
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]

          APPLE_API_KEY="$(mktemp "$RUNNER_TEMP/pimi-notary.XXXXXX")"
          export APPLE_API_KEY
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          printf '%s' "$NOTARY_KEY_BASE64" | base64 -D > "$APPLE_API_KEY"
          unset NOTARY_KEY_BASE64
          test -s "$APPLE_API_KEY"

          npm exec --workspace=@pimi/desktop -- electron-builder \
            --config electron-builder.pimi.yml --mac dmg --arm64 --publish never \
            "--config.mac.identity=$APPLE_TEAM_ID" --config.forceCodeSigning=true \
            --config.mac.hardenedRuntime=true --config.mac.notarize=true \
            --config.dmg.sign=true --config.dmg.writeUpdateInfo=false

          unset CSC_LINK CSC_KEY_PASSWORD
          dmg="packages/desktop/release-pimi/Pimi-${RELEASE_VERSION}-arm64.dmg"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" --wait --output-format json | tee "$RUNNER_TEMP/pimi-notary.json"
          jq -e '.status == "Accepted"' "$RUNNER_TEMP/pimi-notary.json" > /dev/null
          xcrun stapler staple "$dmg"
      - name: Verify macOS installer
        if: vars.APPLE_TEAM_ID != ''
        shell: bash
        working-directory: packages/desktop/release-pimi
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          dmg="Pimi-${RELEASE_VERSION}-arm64.dmg"
          hdiutil verify "$dmg"
          codesign --verify --strict "$dmg"
          xcrun stapler validate "$dmg"

          verification="$(mktemp -d "$RUNNER_TEMP/pimi-dmg.XXXXXX")"
          mountpoint="$verification/mount"
          mkdir "$mountpoint"
          trap 'hdiutil detach "$mountpoint" -quiet || true; rm -rf "$verification/Pimi.app"; rmdir "$mountpoint" "$verification"' EXIT
          hdiutil attach "$dmg" -readonly -nobrowse -noautoopen -mountpoint "$mountpoint"
          # Verify the app after the same bundle copy the updater performs.
          app="$verification/Pimi.app"
          ditto --rsrc --extattr --qtn "$mountpoint/Pimi.app" "$app"
          codesign --verify --deep --strict "$app"
          signature="$(codesign --display --verbose=4 "$app" 2>&1)"
          grep -q '^Authority=Developer ID Application:' <<< "$signature"
          grep -Fxq "TeamIdentifier=$APPLE_TEAM_ID" <<< "$signature"
          xcrun stapler validate "$app"
          syspolicy_check distribution "$app"
          test "$("$app/Contents/Resources/bin/pimi" --version)" = "$RELEASE_VERSION"
          cp "$dmg" Pimi-macOS-arm64.dmg
      - name: Build ad hoc macOS installer
        if: vars.APPLE_TEAM_ID == ''
        env:
          EXPO_NO_TELEMETRY: "1"
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run pimi:package:mac
      - name: Verify ad hoc macOS installer
        if: vars.APPLE_TEAM_ID == ''
        shell: bash
        working-directory: packages/desktop/release-pimi
        run: |
          dmg="Pimi-${RELEASE_VERSION}-arm64.dmg"
          hdiutil verify "$dmg"
          mountpoint="$(mktemp -d "$RUNNER_TEMP/pimi-dmg.XXXXXX")"
          trap 'hdiutil detach "$mountpoint" -quiet || true; rmdir "$mountpoint"' EXIT
          hdiutil attach "$dmg" -readonly -nobrowse -noautoopen -mountpoint "$mountpoint"
          app="$mountpoint/Pimi.app"
          codesign --verify --deep --strict "$app"
          test "$("$app/Contents/Resources/bin/pimi" --version)" = "$RELEASE_VERSION"
          cp "$dmg" Pimi-macOS-arm64.dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pimi-release-mac
          path: packages/desktop/release-pimi/Pimi-macOS-arm64.dmg
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 1

  windows:
    name: Build Windows installer
    needs: [validate, mac]
    if: needs.validate.outputs.build_windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          architecture: x64
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run setup
        env:
          PIMI_SKIP_NATIVE_MARKDOWN_ASSETS: "1"
      - name: Build Windows installer
        env:
          EXPO_NO_TELEMETRY: "1"
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run pimi:package:win
        shell: bash
      - name: Verify Windows installer
        shell: pwsh
        working-directory: packages/desktop/release-pimi
        run: |
          $installer = "Pimi-Setup-$env:RELEASE_VERSION-x64.exe"
          $version = (Get-Item -LiteralPath $installer).VersionInfo.ProductVersion
          if ($version -ne $env:RELEASE_VERSION) { throw "Unexpected installer version: $version" }
          $cliVersion = & .\win-unpacked\resources\bin\pimi.cmd --version
          if ($LASTEXITCODE -ne 0 -or $cliVersion -ne $env:RELEASE_VERSION) { throw "Unexpected CLI version: $cliVersion" }
          Copy-Item -LiteralPath $installer -Destination Pimi-Windows-x64.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pimi-release-win
          path: packages/desktop/release-pimi/Pimi-Windows-x64.exe
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 1

  daemon:
    name: Build Linux daemon bundles
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          architecture: x64
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run build:server
      # npm cross-installs the linux-arm64 optional dependencies from the same lockfile, so both
      # bundles build here. The desktop app downloads the one that matches the remote machine.
      - name: Build daemon bundles
        run: |
          mkdir -p daemon-bundles
          for arch in x64 arm64; do
            node scripts/build-daemon-bundle.mjs "$arch" daemon-bundles
          done
      - name: Verify the x64 daemon bundle runs
        shell: bash
        run: |
          verify="$(mktemp -d "$RUNNER_TEMP/pimi-daemon.XXXXXX")"
          tar -xzf daemon-bundles/Pimi-daemon-linux-x64.tar.gz -C "$verify"
          test "$(node -p "require('$verify/bundle.json').version")" = "$RELEASE_VERSION"
          test "$(node "$verify/node_modules/@pimi/cli/bin/pimi" --version)" = "$RELEASE_VERSION"
          test -f "$verify/node_modules/@pimi/server/node_modules/node-pty/prebuilds/linux-x64/pty.node"
          (cd "$verify/node_modules/@pimi/server" && node -e 'const pty=require("node-pty");const t=pty.spawn("/bin/echo",["ok"],{});t.onExit(()=>process.exit(0))')
          test -f daemon-bundles/Pimi-daemon-linux-arm64.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pimi-release-daemon
          path: |
            daemon-bundles/Pimi-daemon-linux-x64.tar.gz
            daemon-bundles/Pimi-daemon-linux-arm64.tar.gz
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 1

  publish:
    needs: [validate, mac, windows, daemon]
    if: >-
      !cancelled() && needs.validate.result == 'success' && needs.mac.result == 'success' &&
      needs.daemon.result == 'success' &&
      (needs.validate.outputs.build_windows != 'true' || needs.windows.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pimi-release-*
          path: release
      - name: Publish installers and checksums
        working-directory: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Fine-grained PAT scoped to pimi-releases with Contents read/write.
          PIMI_RELEASES_TOKEN: ${{ secrets.PIMI_RELEASES_TOKEN }}
          RELEASES_REPO: 1ikeadragon/pimi-releases
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          MAC_AD_HOC: ${{ vars.APPLE_TEAM_ID == '' }}
          BUILD_WINDOWS: ${{ needs.validate.outputs.build_windows }}
        run: |
          # Resolve the peeled annotated tag, or the direct lightweight tag. The source
          # repo is private, so read it through the API with the job token.
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.type + " " + .object.sha')"
          if [[ "${ref%% *}" == tag ]]; then
            remote="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/${ref#* }" --jq '.object.sha')"
          else
            remote="${ref#* }"
          fi
          test "$remote" = "$RELEASE_COMMIT"

          prefix="pimi-release"
          mv "$prefix-mac/Pimi-macOS-arm64.dmg" .
          test -s Pimi-macOS-arm64.dmg
          assets=(Pimi-macOS-arm64.dmg)
          # The desktop app installs these on remote dev machines over SSH (docs/remote-ssh.md).
          for arch in x64 arm64; do
            mv "$prefix-daemon/Pimi-daemon-linux-$arch.tar.gz" .
            test -s "Pimi-daemon-linux-$arch.tar.gz"
            assets+=("Pimi-daemon-linux-$arch.tar.gz")
          done
          if [[ "$BUILD_WINDOWS" == true ]]; then
            mv "$prefix-win/Pimi-Windows-x64.exe" .
            test -s Pimi-Windows-x64.exe
            assets+=(Pimi-Windows-x64.exe)
          fi
          # Published releases are immutable, so the signed APK from the earlier
          # pimi-android-vX prerelease is attached here for releases/latest links.
          gh release download "pimi-android-v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern Pimi-Android-arm64.apk
          test -s Pimi-Android-arm64.apk
          assets+=(Pimi-Android-arm64.apk)
          if [[ "$MAC_AD_HOC" == true ]]; then
            printf '\n### macOS signing\n\nThe Apple silicon disk image is ad hoc signed and is not notarized. macOS may require approval when opening the new version.\n' >> "$prefix-notes/release-notes.md"
          fi
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          # Publish to the public releases repo. The tag does not exist there yet, so
          # gh creates it on that repo's default branch.
          GH_TOKEN="$PIMI_RELEASES_TOKEN" gh release create "$RELEASE_TAG" "${assets[@]}" SHA256SUMS.txt \
            --repo "$RELEASES_REPO" --title "Pimi $RELEASE_VERSION" \
            --notes-file "$prefix-notes/release-notes.md"
      - name: Sync changelog and docs to pimi-releases
        shell: bash
        env:
          PIMI_RELEASES_TOKEN: ${{ secrets.PIMI_RELEASES_TOKEN }}
          RELEASES_REPO: 1ikeadragon/pimi-releases
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # The app reads CHANGELOG.md and its docs links from the public releases repo,
          # and `npx skills add 1ikeadragon/pimi-releases` installs from skills/.
          git clone --depth 1 "https://x-access-token:${PIMI_RELEASES_TOKEN}@github.com/$RELEASES_REPO.git" releases
          cp source/CHANGELOG.md releases/CHANGELOG.md
          rm -rf releases/docs releases/skills releases/plugin-examples releases/schemas
          mkdir releases/docs releases/schemas
          cp -R source/public-docs/. releases/docs/
          cp source/docs/self-hosted-relay.md source/docs/plugins.md releases/docs/
          cp source/packages/server/schemas/pimi.config.v1.json releases/schemas/
          cp -R source/skills releases/skills
          cp -R source/plugin-examples releases/plugin-examples
          # These two internal docs link to source paths that are not published. Flatten the
          # public-docs links and drop links to unpublished files, keeping the link text.
          perl -pi -e 's{\.\./public-docs/}{}g; s{public-docs/}{}g; s{\[([^\]]+)\]\((?:\.\./packages/[^)]*|protocol-compatibility\.md[^)]*|unistyles\.md|relay-endpoint-security\.md|providers\.md#provider-snapshot[^)]*)\)}{$1}g' \
            releases/docs/plugins.md releases/docs/self-hosted-relay.md
          cd releases
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -m "Pimi $RELEASE_VERSION docs and changelog"
          git push origin HEAD:main
